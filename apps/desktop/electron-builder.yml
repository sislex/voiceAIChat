appId: com.voiceaichat.app
productName: Голос·Чат
directories:
  output: release
  buildResources: build

# Ad-hoc подпись после упаковки — иначе на Apple Silicon macOS считает
# неподписанный .app «повреждённым» и не даёт открыть.
afterPack: scripts/afterPack.cjs

# В бандл кладём только собранный код и манифест. node_modules с прод-зависимостями
# electron-builder добавляет сам. Локальные модели и движки не бандлятся:
files:
  - out/**/*
  - package.json
  - '!models/**'
  - '!src/**'
  - '!task/**'
  - '!**/*.map'

# Нативные части нельзя держать в asar: их нужно грузить/исполнять из ФС.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

protocols:
  - name: VoiceChat Device Enrollment
    schemes:
      - voicechat-login

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  # Локальная сборка без подписи (нет сертификата) — приложение запускается
  # с предупреждением Gatekeeper. Для распространения добавить identity/notarize.
  identity: null

dmg:
  title: Голос·Чат

# Пересобрать нативные модули под ABI Electron.
npmRebuild: true

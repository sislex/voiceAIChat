# Append after Identity; its provider grants must include this Billing installation.
services:
  billing:
    image: ${SISLEXA_BILLING_IMAGE:-ghcr.io/sislex/billing:06a337fdab30df2ca5af70e9f3cf5b6c96a5cffe}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8800"
      BILLING_DATA_DIR: /data
      SISLEXA_COMPONENT_CONFIG: /run/sislexa/config.json
    volumes:
      - vc-billing-data:/data
      - ${SISLEXA_COMPONENTS_DIR:?Set the private component directory}/billing/config.json:/run/sislexa/config.json:ro
      - ${SISLEXA_COMPONENTS_DIR:?Set the private component directory}/billing/outgoing:/run/sislexa/outgoing:ro
      - ${SISLEXA_COMPONENTS_DIR:?Set the private component directory}/billing/provider:/run/sislexa/provider
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8800/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"
volumes:
  vc-billing-data:

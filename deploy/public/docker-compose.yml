# Public minimal Sislexa: sign-up and sign-in (Identity), billing with a daily user limit,
# chat (Chat/Required only) and file storage. No machines, Make, projects, studio or Kanban.
#
# Prepare once:  npm run public:install -- --domain sislexa.by --tls admin@sislexa.by
# Start:         npm run public:docker
# The state directory (secrets, component tokens) is created by public:install; see README.md.

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sislexa
      POSTGRES_USER: sislexa
      POSTGRES_PASSWORD: ${PUBLIC_PG_PASSWORD:?Run public:install first}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-storage.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sislexa -d sislexa"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  voicechat:
    build:
      context: ../..
      target: server-runtime
      args:
        VC_APPLICATION_VERSION: ${PUBLIC_CORE_VERSION:?Run public:install first}
        VC_APPLICATION_API_VERSION: "1.1.0"
        VC_APPLICATION_DATA_VERSION: "1.0.0"
        VC_APPLICATION_COMMIT: ${PUBLIC_CORE_COMMIT}
    image: ${PUBLIC_CORE_IMAGE:-sislexa-public-core}
    init: true
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "cd apps/server && exec node --max-old-space-size=768 --import tsx src/index.ts"]
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      VC_DATA_DIR: /data
      VC_APPLICATION_VERSION: ${PUBLIC_CORE_VERSION}
      VC_APPLICATION_API_VERSION: "1.1.0"
      VC_APPLICATION_DATA_VERSION: "1.0.0"
      VC_APPLICATION_COMMIT: ${PUBLIC_CORE_COMMIT}
      VC_DB_URL: postgres://sislexa:${PUBLIC_PG_PASSWORD}@postgres:5432/sislexa
      VC_CORE_ID: ${PUBLIC_DOMAIN}
      VC_PUBLIC_URL: ${PUBLIC_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      # Chat and file storage only; every other application is off.
      # The storage application opens in the browser at its public address; Core calls it inside the network.
      VC_APPLICATIONS: chat,identity,storage=${PUBLIC_STORAGE_URL}
      VC_APPLICATION_STORAGE_TOKEN: ${PUBLIC_STORAGE_APP_TOKEN}
      VC_CHAT_MODELS: ${PUBLIC_CHAT_MODELS}
      VC_CHAT_TEXT_ONLY: "true"
      VC_CHAT_REQUIRE_BILLING: "true"
      VC_MACHINES_MODE: embedded
      VC_KANBAN_MODE: "off"
      VC_TTS_RUNNER_URL: ""
      VC_STT_RUNNER_URL: ""
      VC_FILE_STORAGE_MODE: remote
      VC_FILE_STORAGE_URL: http://storage:8799
      VC_FILE_STORAGE_SERVICE_TOKEN_FILE: /run/public/storage/core-service.token
      VC_FILE_STORAGE_NODES: '[{"id":"node-1","url":"http://storage-node:8795","tokenFile":"/run/public/storage/node.token"}]'
      VC_FILE_STORAGE_DEFAULT_QUOTA_BYTES: ${PUBLIC_STORAGE_QUOTA_BYTES}
      VC_LLM_RUNNER_CLAUDE_URL: ${PUBLIC_RUNNER_URL}
      VC_LLM_RUNNER_CODEX_URL: ${PUBLIC_RUNNER_URL}
      VC_LLM_RUNNER_TOKEN: ${PUBLIC_RUNNER_TOKEN}
      VC_INTERNAL_TOKEN: ${PUBLIC_INTERNAL_TOKEN}
      VC_MCP_SECRET: ${PUBLIC_MCP_SECRET}
      VC_MCP_PUBLIC_BASE: http://voicechat:8787
      VC_SMTP_URL: ${PUBLIC_SMTP_URL:-}
      VC_MAIL_FROM: ${PUBLIC_MAIL_FROM:-}
      SISLEXA_COMPONENT_CONFIG: /run/sislexa/config.json
    volumes:
      - core-data:/data
      # Identity signs the sessions Core verifies, so both read one secret.
      - ${PUBLIC_STATE_DIR}/identity-session.secret:/data/session.secret:ro
      - ${PUBLIC_STATE_DIR}/components/core/config.json:/run/sislexa/config.json:ro
      - ${PUBLIC_STATE_DIR}/components/core/outgoing:/run/sislexa/outgoing:ro
      - ${PUBLIC_STATE_DIR}/components/core/provider:/run/sislexa/provider
      - ${PUBLIC_STATE_DIR}/storage:/run/public/storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    logging: *logging

  identity:
    image: ${PUBLIC_IDENTITY_IMAGE:-ghcr.io/sislex/identity:15cbb00539bbd6d2938614f4881b47c348b1dd6f}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      HOST: 0.0.0.0
      PORT: "8798"
      SISLEXA_COMPONENT_CONFIG: /run/sislexa/config.json
      IDENTITY_DATABASE_URL: postgres://sislexa:${PUBLIC_PG_PASSWORD}@postgres:5432/sislexa
      IDENTITY_SESSION_SECRET_FILE: /run/sislexa/session.secret
      IDENTITY_PUBLIC_URL: ${PUBLIC_URL}
      IDENTITY_ADMIN_PASSWORD: ${PUBLIC_ADMIN_PASSWORD}
      VC_SMTP_URL: ${PUBLIC_SMTP_URL:-}
      VC_MAIL_FROM: ${PUBLIC_MAIL_FROM:-}
      VC_HIBP_CHECK: "0"
    volumes:
      - ${PUBLIC_STATE_DIR}/components/identity/config.json:/run/sislexa/config.json:ro
      - ${PUBLIC_STATE_DIR}/components/identity/outgoing:/run/sislexa/outgoing:ro
      - ${PUBLIC_STATE_DIR}/components/identity/provider:/run/sislexa/provider
      - ${PUBLIC_STATE_DIR}/identity-session.secret:/run/sislexa/session.secret:ro
    mem_limit: 512m
    logging: *logging

  billing:
    image: ${PUBLIC_BILLING_IMAGE:-ghcr.io/sislex/billing:5b4840a35e0dfed3108141794d7290d25f267e4a}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8800"
      BILLING_DATA_DIR: /data
      BILLING_DAILY_USER_MICRO_USD: ${PUBLIC_DAILY_USER_MICRO_USD}
      BILLING_DAILY_USER_TIME_ZONE: ${PUBLIC_TIME_ZONE}
      SISLEXA_COMPONENT_CONFIG: /run/sislexa/config.json
    volumes:
      - billing-data:/data
      - ${PUBLIC_STATE_DIR}/components/billing/config.json:/run/sislexa/config.json:ro
      - ${PUBLIC_STATE_DIR}/components/billing/outgoing:/run/sislexa/outgoing:ro
      - ${PUBLIC_STATE_DIR}/components/billing/provider:/run/sislexa/provider
    mem_limit: 256m
    logging: *logging

  storage:
    build:
      context: ${PUBLIC_STORAGE_SOURCE:?Path of a sislex/storage checkout}
      dockerfile: apps/service/Dockerfile
    image: ${PUBLIC_STORAGE_IMAGE:-sislexa-public-storage}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8799"
      # Metadata in its own database of the shared Postgres (Core uses the same storage_* table
      # names for its embedded storage); no writable volume needed.
      STORAGE_DB_URL: postgres://sislexa:${PUBLIC_PG_PASSWORD}@postgres:5432/storage
      STORAGE_NODES: '[{"id":"node-1","url":"http://storage-node:8795","tokenFile":"/run/public/storage/node.token"}]'
      STORAGE_DEFAULT_QUOTA_BYTES: ${PUBLIC_STORAGE_QUOTA_BYTES}
      STORAGE_AUTH_MODE: legacy
      STORAGE_CORE_ID: ${PUBLIC_DOMAIN}
      STORAGE_CORE_URL: http://voicechat:8787
      STORAGE_CORE_PUBLIC_URL: ${PUBLIC_URL}
      STORAGE_IDENTITY_URL: http://identity:8798
      VC_APPLICATION_STORAGE_TOKEN_FILE: /run/public/storage/app.token
      STORAGE_CORE_SERVICE_TOKEN_FILE: /run/public/storage/core-service.token
      STORAGE_IDENTITY_TOKEN_FILE: /run/public/storage/identity.token
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ${PUBLIC_STATE_DIR}/storage:/run/public/storage:ro
    mem_limit: 256m
    logging: *logging

  storage-node:
    build:
      context: ../..
      target: file-storage-node
    image: ${PUBLIC_STORAGE_NODE_IMAGE:-sislexa-public-storage-node}
    restart: unless-stopped
    environment:
      VC_FILE_STORAGE_NODE_ID: node-1
      VC_FILE_STORAGE_DIR: /data/blobs
      VC_FILE_STORAGE_CAPACITY_BYTES: ${PUBLIC_STORAGE_CAPACITY_BYTES}
      VC_FILE_STORAGE_TOKEN_FILE: /run/public/storage/node.token
      HOST: 0.0.0.0
      PORT: "8795"
    volumes:
      - storage-blobs:/data
      - ${PUBLIC_STATE_DIR}/storage/node.token:/run/public/storage/node.token:ro
    mem_limit: 256m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [voicechat, storage]
    environment:
      PUBLIC_SITE: ${PUBLIC_SITE}
      PUBLIC_WWW_SITE: ${PUBLIC_WWW_SITE}
      PUBLIC_FILES_SITE: ${PUBLIC_FILES_SITE}
      PUBLIC_TLS_LINE: ${PUBLIC_TLS_LINE}
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  postgres:
  core-data:
  billing-data:
  storage-blobs:
  caddy-data:
  caddy-config:

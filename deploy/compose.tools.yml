# Build independent repositories at the exact commits in tools.lock.json.
# Append this file after operator overrides; preserve the existing override chain.
services:
  voicechat:
    environment:
      VC_READER_MODE: remote
      VC_APPLICATION_FRONTENDS: '{"make-ui":"http://make-ui:8080","playwright-reader-ui":"http://playwright-reader-ui:8080","web-reader-ui":"http://web-reader-ui:8080"}'
  make:
    build:
      context: ${SISLEXA_MAKE_SOURCE:?Set the pinned make source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "93055744002585c176ab9b1067b9c65653524623"
    image: sislexa-make:1.1.0-930557440025
    environment:
      VC_RELEASE_VERSION: "1.1.0"
      VC_APPLICATION_COMMIT: "93055744002585c176ab9b1067b9c65653524623"
  make-ui:
    build:
      context: ${SISLEXA_MAKE_SOURCE:?Set the pinned make source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "93055744002585c176ab9b1067b9c65653524623"
    image: sislexa-make-ui:1.1.0-930557440025
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - make-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  playwright-reader:
    build:
      context: ${SISLEXA_PLAYWRIGHT_READER_SOURCE:?Set the pinned playwright-reader source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "1973eb506b2023a8d06778ca38f85997ded8cb09"
    image: sislexa-playwright-reader:1.1.0-1973eb506b20
    environment:
      VC_RELEASE_VERSION: "1.1.0"
      VC_APPLICATION_COMMIT: "1973eb506b2023a8d06778ca38f85997ded8cb09"
  playwright-reader-ui:
    build:
      context: ${SISLEXA_PLAYWRIGHT_READER_SOURCE:?Set the pinned playwright-reader source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "1973eb506b2023a8d06778ca38f85997ded8cb09"
    image: sislexa-playwright-reader-ui:1.1.0-1973eb506b20
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - playwright-reader-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  reader:
    build:
      context: ${SISLEXA_WEB_READER_SOURCE:?Set the pinned web-reader source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "ff068915690f92d857ffb2635682b8c189b7e211"
    image: sislexa-web-reader:1.1.0-ff068915690f
    environment:
      VC_RELEASE_VERSION: "1.1.0"
      VC_APPLICATION_COMMIT: "ff068915690f92d857ffb2635682b8c189b7e211"
    profiles: !reset []
  web-reader-ui:
    build:
      context: ${SISLEXA_WEB_READER_SOURCE:?Set the pinned web-reader source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.0"
        APPLICATION_COMMIT: "ff068915690f92d857ffb2635682b8c189b7e211"
    image: sislexa-web-reader-ui:1.1.0-ff068915690f
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - web-reader-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  make-ui-assets:
  playwright-reader-ui-assets:
  web-reader-ui-assets:

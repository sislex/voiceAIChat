# Build independent repositories at the exact commits in tools.lock.json.
# Append this file after operator overrides; preserve the existing override chain.
services:
  voicechat:
    environment:
      VC_READER_MODE: remote
      VC_APPLICATION_FRONTENDS: '{"make-ui":"http://make-ui:8080","playwright-reader-ui":"http://playwright-reader-ui:8080","web-reader-ui":"http://web-reader-ui:8080"}'
  make:
    build:
      context: ${SISLEXA_MAKE_SOURCE:?Set the pinned make source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.3"
        APPLICATION_COMMIT: "41955a601c2fc8f784263caf22a38b2955ba33a5"
    image: sislexa-make:1.1.3-41955a601c2f
    environment:
      VC_RELEASE_VERSION: "1.1.3"
      VC_APPLICATION_COMMIT: "41955a601c2fc8f784263caf22a38b2955ba33a5"
  make-ui:
    build:
      context: ${SISLEXA_MAKE_SOURCE:?Set the pinned make source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.3"
        APPLICATION_COMMIT: "41955a601c2fc8f784263caf22a38b2955ba33a5"
    image: sislexa-make-ui:1.1.3-41955a601c2f
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - make-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  playwright-reader:
    build:
      context: ${SISLEXA_PLAYWRIGHT_READER_SOURCE:?Set the pinned playwright-reader source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.2"
        APPLICATION_COMMIT: "159b8bd4a8437f34f54b20b0c11f5fb3b4a81662"
    image: sislexa-playwright-reader:1.1.2-159b8bd4a843
    environment:
      VC_RELEASE_VERSION: "1.1.2"
      VC_APPLICATION_COMMIT: "159b8bd4a8437f34f54b20b0c11f5fb3b4a81662"
  playwright-reader-ui:
    build:
      context: ${SISLEXA_PLAYWRIGHT_READER_SOURCE:?Set the pinned playwright-reader source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.2"
        APPLICATION_COMMIT: "159b8bd4a8437f34f54b20b0c11f5fb3b4a81662"
    image: sislexa-playwright-reader-ui:1.1.2-159b8bd4a843
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - playwright-reader-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  reader:
    build:
      context: ${SISLEXA_WEB_READER_SOURCE:?Set the pinned web-reader source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.1.2"
        APPLICATION_COMMIT: "2d0f30bd50d6662613ede3aa5af15a07e09d0183"
    image: sislexa-web-reader:1.1.2-2d0f30bd50d6
    environment:
      VC_RELEASE_VERSION: "1.1.2"
      VC_APPLICATION_COMMIT: "2d0f30bd50d6662613ede3aa5af15a07e09d0183"
    profiles: !reset []
  web-reader-ui:
    build:
      context: ${SISLEXA_WEB_READER_SOURCE:?Set the pinned web-reader source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.1.2"
        APPLICATION_COMMIT: "2d0f30bd50d6662613ede3aa5af15a07e09d0183"
    image: sislexa-web-reader-ui:1.1.2-2d0f30bd50d6
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - web-reader-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  make-ui-assets:
  playwright-reader-ui-assets:
  web-reader-ui-assets:

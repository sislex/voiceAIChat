# Append after compose.tools.yml. Source paths must match tools.lock.json.
services:
  voicechat:
    environment:
      VC_IMAGE_STUDIO_MODE: remote
      VC_APPLICATION_FRONTENDS: '{"make-ui":"http://make-ui:8080","playwright-reader-ui":"http://playwright-reader-ui:8080","web-reader-ui":"http://web-reader-ui:8080","image-studio-ui":"http://image-studio-ui:8080"}'
  stt-runner:
    build:
      context: ${SISLEXA_VOICE_SOURCE:?Set the pinned source checkout}
      target: stt
      args:
        APPLICATION_VERSION: "1.0.1"
        APPLICATION_COMMIT: "996189176d06f327bda31b71899ef5c83a4360e9"
    image: sislexa-stt-runner:1.0.1-996189176d06
    environment:
      VC_RELEASE_VERSION: "1.0.1"
      VC_APPLICATION_VERSION: "1.0.1"
      VC_APPLICATION_COMMIT: "996189176d06f327bda31b71899ef5c83a4360e9"
  tts-runner:
    build:
      context: ${SISLEXA_VOICE_SOURCE:?Set the pinned source checkout}
      target: tts
      args:
        APPLICATION_VERSION: "1.0.1"
        APPLICATION_COMMIT: "996189176d06f327bda31b71899ef5c83a4360e9"
    image: sislexa-tts-runner:1.0.1-996189176d06
    environment:
      VC_RELEASE_VERSION: "1.0.1"
      VC_APPLICATION_VERSION: "1.0.1"
      VC_APPLICATION_COMMIT: "996189176d06f327bda31b71899ef5c83a4360e9"
  image-studio:
    build:
      context: ${SISLEXA_IMAGE_STUDIO_SOURCE:?Set the pinned source checkout}
      target: api
      args:
        APPLICATION_VERSION: "1.0.3"
        APPLICATION_COMMIT: "46ab3a7c8b6940030247aff2de5bbfaf767170dc"
    image: sislexa-image-studio:1.0.3-46ab3a7c8b69
    environment:
      VC_RELEASE_VERSION: "1.0.3"
      VC_APPLICATION_VERSION: "1.0.3"
      VC_APPLICATION_COMMIT: "46ab3a7c8b6940030247aff2de5bbfaf767170dc"
  image-studio-ui:
    build:
      context: ${SISLEXA_IMAGE_STUDIO_SOURCE:?Set the pinned source checkout}
      target: frontend
      args:
        APPLICATION_VERSION: "1.0.3"
        APPLICATION_COMMIT: "46ab3a7c8b6940030247aff2de5bbfaf767170dc"
    image: sislexa-image-studio-ui:1.0.3-46ab3a7c8b69
    environment:
      VC_RELEASE_VERSION: "1.0.3"
      VC_APPLICATION_VERSION: "1.0.3"
      VC_APPLICATION_COMMIT: "46ab3a7c8b6940030247aff2de5bbfaf767170dc"
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - image-studio-ui-assets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  image-studio-ui-assets:

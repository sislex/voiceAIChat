# voiceAIChat в Docker: сервер + web на одном порту, а claude/codex CLI живут
# во внутренних контейнерах-исполнителях runner-work и runner-personal.
#
# Запуск:
#   docker compose up --build
#   → открыть http://localhost:8787
#
# `runner-work` получает прежние тома `vc-claude` / `vc-codex`, поэтому после
# деплоя рабочая авторизация продолжает жить без повторного логина. Его
# пользовательские профили (`/data/cli-users`) при первом старте копируются из
# старого серверного тома `vc-data` в отдельный volume исполнителя.
#
# `runner-personal` хранит отдельные auth/profile volume и требует одноразового
# логина внутри контейнера:
#   docker compose exec -u node runner-personal claude auth login
#   # или headless: claude setup-token

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  voicechat:
    build:
      context: .
      target: server-runtime
    image: voicechat-server
    mem_limit: 1g
    ports:
      - "8787:8787"
    depends_on:
      - make
      - playwright-reader
      - image-studio
      - runner-work
      - runner-personal
      - tts-runner
      - stt-runner
      - automation-runner
      - browser-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      VC_DATA_DIR: /data
      # Web Reader использует те же разрешённые алиасы, что и browser-runner.
      VC_BROWSER_HOST_ALIASES: ${VC_BROWSER_HOST_ALIASES:-}
      # Make — отдельный сервис (docs/plans/make-standalone.md): ядро переправляет
      # ему /api/make/*, превью и публикации, а исполнителю отдаёт его адрес MCP.
      # Токен и секрет общие с сервисом make; для прода задай случайные в .env.
      # База на Postgres вместо SQLite-файла: задай VC_DB_URL в .env (например,
      # postgres://voicechat:${VC_PG_PASSWORD}@postgres:5432/voicechat при поднятом
      # профиле `postgres` ниже) и перенеси данные: docs/kb/data-auth.md#схема.
      # Пусто — SQLite в /data/voicechat.db, как раньше.
      VC_DB_URL: ${VC_DB_URL:-}
      VC_IMAGE_STUDIO_MODE: remote
      VC_IMAGE_STUDIO_URL: http://image-studio:8796
      VC_MAKE_MODE: remote
      VC_PLAYWRIGHT_READER_MODE: remote
      VC_PLAYWRIGHT_READER_URL: http://playwright-reader:8797
      VC_MAKE_URL: http://make:8788
      VC_MAKE_MCP_PUBLIC_BASE: http://make:8788
      # Канбан отдельным процессом (docs/plans/kanban-service.md): по умолчанию кластер проектов/CI/QA
      # встроен в ядро. Включение — VC_KANBAN_MODE=remote в .env вместе с VC_DB_URL (общая база
      # Postgres) и профилями `--profile postgres --profile kanban`.
      VC_KANBAN_MODE: ${VC_KANBAN_MODE:-embedded}
      VC_KANBAN_URL: http://kanban:8789
      VC_KANBAN_MCP_PUBLIC_BASE: http://kanban:8789
      # Машины отдельным процессом (docs/plans/machines-service.md): по умолчанию реестр и WebSocket агентов
      # в ядре. Включение — VC_MACHINES_MODE=remote в .env вместе с VC_DB_URL и `--profile machines`.
      VC_MACHINES_MODE: ${VC_MACHINES_MODE:-embedded}
      VC_MACHINES_URL: http://machines:8793
      # Админка отдельным процессом (docs/plans/machines-service.md, круг 3): VC_ADMIN_MODE=remote + `--profile admin`.
      VC_ADMIN_MODE: ${VC_ADMIN_MODE:-embedded}
      VC_ADMIN_URL: http://admin:8794
      # Web Reader отдельным процессом (docs/plans/web-reader-service.md): VC_READER_MODE=remote + `--profile reader`.
      VC_READER_MODE: ${VC_READER_MODE:-embedded}
      VC_READER_URL: http://reader:8795
      VC_READER_MCP_PUBLIC_BASE: http://reader:8795
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_MCP_SECRET: ${VC_MCP_SECRET:-voicechat-mcp-local-secret}
      # Метаданные релиза: номер приходит от публикации или строгого Git-тега;
      # пустое значение означает, что версия выпуска неизвестна.
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
      VC_RELEASED_AT: ${VC_RELEASED_AT:-}
      VC_RELEASE_COMMIT: ${VC_RELEASE_COMMIT:-}
      VC_RELEASE_TASK: ${VC_RELEASE_TASK:-}
      VC_LLM_RUNNER_CLAUDE_URL: http://runner-work:8790
      VC_LLM_RUNNER_CODEX_URL: http://runner-work:8790
      VC_LLM_RUNNER_TOKEN: ${VC_LLM_RUNNER_TOKEN:-voicechat-runner-local-token}
      VC_TTS_RUNNER_URL: http://tts-runner:8791
      VC_TTS_RUNNER_TOKEN: ${VC_TTS_RUNNER_TOKEN:-voicechat-tts-local-token}
      VC_STT_RUNNER_URL: http://stt-runner:8791
      VC_STT_RUNNER_TOKEN: ${VC_STT_RUNNER_TOKEN:-voicechat-stt-runner-local-token}
      # Playwright Reader и этап автотестов: без этих переменных сервер отвечает
      # 501, а панель показывает «изолированный Chromium недоступен».
      VC_BROWSER_RUNNER_URL: http://browser-runner:8792
      VC_BROWSER_RUNNER_TOKEN: ${VC_BROWSER_RUNNER_TOKEN:-voicechat-browser-local-token}
      # Host-side deploy API доступен только через примонтированный Unix-сокет.
      VC_DEPLOY_API_SOCKET: /run/voicechat/deploy-api.sock
      # Адрес, по которому MCP-эндпоинты сервера (remote-bash, kb, ci-commands)
      # видны ИЗ контейнера исполнителя. Без него сервер отдаёт CLI собственный
      # loopback, а в контейнере исполнителя на 127.0.0.1:8787 никого нет —
      # инструменты mcp__remote__*/mcp__kb__* тогда молча пропадают у модели.
      VC_MCP_PUBLIC_BASE: ${VC_MCP_PUBLIC_BASE:-http://voicechat:8787}
      # Адрес сервера для изолированного Chromium: по нему он открывает прокси
      # превью в браузерных проверках задач. Должен совпадать с
      # VC_BROWSER_PREVIEW_ORIGIN у browser-runner — иначе SSRF-гейт раннера
      # зарежет запрос (имя сервера в сети compose ведёт в приватную сеть).
      VC_BROWSER_PREVIEW_BASE: ${VC_BROWSER_PREVIEW_BASE:-http://voicechat:8787}
      # Пароль admin при первом создании БД (пустой том). Задаётся в shell/.env;
      # если БД уже создана, пароль меняется в UI (Настройки → Пользователи).
      VC_ADMIN_PASSWORD: ${VC_ADMIN_PASSWORD:-}
      # Почта для регистрации с подтверждением email: задаются в .env на прод-сервере.
      VC_SMTP_URL: ${VC_SMTP_URL:-}
      VC_MAIL_FROM: ${VC_MAIL_FROM:-}
      VC_PUBLIC_URL: ${VC_PUBLIC_URL:-}
      # Anthropic-compatible backend для внешних клиентов Claude Code.
      # Значения берутся из shell/.env; если URL пуст, gateway отвечает 503.
      VC_CLAUDE_GATEWAY_BACKEND: ${VC_CLAUDE_GATEWAY_BACKEND:-upstream}
      VC_CLAUDE_UPSTREAM_URL: ${VC_CLAUDE_UPSTREAM_URL:-}
      VC_CLAUDE_UPSTREAM_API_KEY: ${VC_CLAUDE_UPSTREAM_API_KEY:-}
      VC_CLAUDE_UPSTREAM_AUTH: ${VC_CLAUDE_UPSTREAM_AUTH:-x-api-key}
      VC_CLAUDE_MODEL_MAP: ${VC_CLAUDE_MODEL_MAP:-{}}
    volumes:
      - vc-data:/data
      - /run/voicechat:/run/voicechat
    # Дополнительная группа совпадает с владельцем host-side deploy-сокета.
    group_add:
      - "65532"
    logging: *default-logging
    restart: unless-stopped

  # Postgres для базы приложения — опционально (профиль `postgres`): по умолчанию сервер
  # работает на SQLite. Включение: `docker compose --profile postgres up -d postgres`,
  # затем VC_DB_URL у voicechat (см. выше) и перенос данных copyToPostgres.cli.ts.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_DB: voicechat
      POSTGRES_USER: voicechat
      # Не `:?` — compose подставляет переменные всех сервисов даже при выключенном профиле, и обязательная
      # переменная ломала бы `docker compose up` без Postgres. Пустой пароль остановит только сам контейнер.
      POSTGRES_PASSWORD: ${VC_PG_PASSWORD:-}
    volumes:
      - vc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicechat -d voicechat"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # Make (веб-проект с ассистентом) отдельным процессом: релизится и перезапускается
  # без ядра. Том данных общий — мастерские лежат в /data/make, ядро в них не пишет.
  make:
    build:
      context: .
      target: make-runtime
    image: voicechat-make
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      VC_DATA_DIR: /data
      VC_CORE_URL: http://voicechat:8787
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_MCP_SECRET: ${VC_MCP_SECRET:-voicechat-mcp-local-secret}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    volumes:
      - vc-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Playwright Reader владеет REST-сессиями и действиями модели. БД и том ему не нужны:
  # разговоры и авторизация приходят от ядра, профили Chromium остаются в browser-runner.
  playwright-reader:
    build:
      context: .
      target: playwright-reader-runtime
    image: voicechat-playwright-reader
    mem_limit: 256m
    depends_on:
      - browser-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8797"
      VC_CORE_URL: http://voicechat:8787
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_BROWSER_PREVIEW_BASE: ${VC_BROWSER_PREVIEW_BASE:-http://voicechat:8787}
      VC_BROWSER_RUNNER_URL: http://browser-runner:8792
      VC_BROWSER_RUNNER_TOKEN: ${VC_BROWSER_RUNNER_TOKEN:-voicechat-browser-local-token}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8797/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Студия картинок владеет /data/image-studio; авторизация и LLM остаются у ядра.
  image-studio:
    build:
      context: .
      target: image-studio-runtime
    image: voicechat-image-studio
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "8796"
      VC_DATA_DIR: /data
      VC_CORE_URL: http://voicechat:8787
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    volumes:
      - vc-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8796/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Канбан (проекты, доска, CI/QA/релизы) отдельным процессом на той же базе Postgres
  # (docs/plans/kanban-service.md). Профиль `kanban`: включается вместе с VC_KANBAN_MODE=remote
  # у ядра. Том данных общий — скриншоты QA и вложения читаются с /data напрямую, как у Make.
  kanban:
    build:
      context: .
      target: kanban-runtime
    image: voicechat-kanban
    profiles: ["kanban"]
    mem_limit: 1g
    depends_on:
      - runner-work
      - runner-personal
      - browser-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8789"
      VC_DATA_DIR: /data
      VC_CORE_URL: http://voicechat:8787
      # Без `:?` по той же причине, что у postgres; без базы процесс канбана сам завершится с понятной ошибкой.
      VC_DB_URL: ${VC_DB_URL:-}
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_MCP_SECRET: ${VC_MCP_SECRET:-voicechat-mcp-local-secret}
      # MCP ядра (машины, KB, превью) глазами исполнителя — адрес ядра; MCP канбана и CI-команд — этот процесс.
      VC_MCP_PUBLIC_BASE: ${VC_MCP_PUBLIC_BASE:-http://voicechat:8787}
      VC_KANBAN_MCP_PUBLIC_BASE: http://kanban:8789
      # MCP «browser» ходов рана: при вынесенном ридере — его адрес (те же переменные, что у ядра).
      VC_READER_MODE: ${VC_READER_MODE:-embedded}
      VC_READER_URL: http://reader:8795
      VC_READER_MCP_PUBLIC_BASE: http://reader:8795
      VC_MAKE_URL: http://make:8788
      VC_MAKE_MCP_PUBLIC_BASE: http://make:8788
      VC_LLM_RUNNER_CLAUDE_URL: http://runner-work:8790
      VC_LLM_RUNNER_CODEX_URL: http://runner-work:8790
      VC_LLM_RUNNER_TOKEN: ${VC_LLM_RUNNER_TOKEN:-voicechat-runner-local-token}
      VC_BROWSER_RUNNER_URL: http://browser-runner:8792
      VC_BROWSER_RUNNER_TOKEN: ${VC_BROWSER_RUNNER_TOKEN:-voicechat-browser-local-token}
      VC_SMTP_URL: ${VC_SMTP_URL:-}
      VC_MAIL_FROM: ${VC_MAIL_FROM:-}
      VC_PUBLIC_URL: ${VC_PUBLIC_URL:-}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    volumes:
      - vc-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Машины (реестр компаньон-агентов, их WebSocket, exec/fs/PTY, установщики) отдельным процессом на той
  # же базе Postgres (docs/plans/machines-service.md). Профиль `machines`: включается вместе с
  # VC_MACHINES_MODE=remote у ядра. Агенты по-прежнему ходят на публичный хост `/agent` — ядро переправляет
  # их WebSocket сюда. Том данных общий (артефакты установщиков, перенос хранилищ).
  machines:
    build:
      context: .
      target: machines-runtime
    image: voicechat-machines
    profiles: ["machines"]
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "8793"
      VC_DATA_DIR: /data
      VC_CORE_URL: http://voicechat:8787
      # Без `:?`: compose подставляет переменные всех сервисов независимо от профилей; без базы процесс сам завершится с понятной ошибкой.
      VC_DB_URL: ${VC_DB_URL:-}
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_PUBLIC_URL: ${VC_PUBLIC_URL:-}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    volumes:
      - vc-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Админка (`/api/admin/*`: пользователи, роли, сессии, версии агентов, расход Make, деплой) отдельным
  # процессом на той же базе Postgres. Профиль `admin`, у ядра VC_ADMIN_MODE=remote. Машины берёт у процесса
  # машин (VC_MACHINES_URL) или у ядра тем же внутренним API; деплой и отзыв сессий — RPC к ядру.
  admin:
    build:
      context: .
      target: admin-runtime
    image: voicechat-admin
    profiles: ["admin"]
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "8794"
      VC_DATA_DIR: /data
      VC_CORE_URL: http://voicechat:8787
      # Задать VC_MACHINES_URL=http://machines:8793, если машины тоже вынесены; пусто — машины у ядра.
      VC_MACHINES_URL: ${VC_ADMIN_MACHINES_URL:-}
      VC_MAKE_URL: http://make:8788
      VC_DB_URL: ${VC_DB_URL:-}
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_MCP_SECRET: ${VC_MCP_SECRET:-voicechat-mcp-local-secret}
      VC_SMTP_URL: ${VC_SMTP_URL:-}
      VC_MAIL_FROM: ${VC_MAIL_FROM:-}
      VC_PUBLIC_URL: ${VC_PUBLIC_URL:-}
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    volumes:
      - vc-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8794/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # Web Reader (прокси превью `/api/preview*`, MCP «browser» `/mcp/preview`, действия в изолированном Chromium)
  # отдельным процессом на той же базе Postgres (docs/plans/web-reader-service.md). Профиль `reader`, у ядра
  # VC_READER_MODE=remote. Машины берёт у процесса машин (VC_MACHINES_URL) или у ядра; relay в панель
  # пользователя, ключи Chromium, список превью и кадры проверок — RPC к ядру. Общий том не нужен.
  reader:
    build:
      context: .
      target: reader-runtime
    image: voicechat-reader
    profiles: ["reader"]
    mem_limit: 512m
    depends_on:
      - playwright-reader
    environment:
      HOST: 0.0.0.0
      PORT: "8795"
      VC_DATA_DIR: /data
      VC_BROWSER_HOST_ALIASES: ${VC_BROWSER_HOST_ALIASES:-}
      VC_CORE_URL: http://voicechat:8787
      # Задать VC_MACHINES_URL=http://machines:8793, если машины тоже вынесены; пусто — машины у ядра.
      VC_MACHINES_URL: ${VC_READER_MACHINES_URL:-}
      VC_DB_URL: ${VC_DB_URL:-}
      VC_INTERNAL_TOKEN: ${VC_INTERNAL_TOKEN:-voicechat-internal-local-token}
      VC_MCP_SECRET: ${VC_MCP_SECRET:-voicechat-mcp-local-secret}
      VC_PLAYWRIGHT_READER_MODE: remote
      VC_PLAYWRIGHT_READER_URL: http://playwright-reader:8797
      VC_RELEASE_VERSION: ${VC_RELEASE_VERSION:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8795/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  stt-runner:
    build:
      context: .
      target: stt-runner-runtime
    image: voicechat-stt-runner
    mem_limit: 6g
    cpus: 2
    environment:
      HOST: 0.0.0.0
      PORT: "8791"
      VC_STT_RUNNER_TOKEN: ${VC_STT_RUNNER_TOKEN:-voicechat-stt-runner-local-token}
      VC_MODELS_DIR: /models
      VC_STT_TEMP_DIR: /stt-tmp
    volumes:
      - vc-stt-models:/models
      - vc-stt-temp:/stt-tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/v1/health',{headers:{authorization:'Bearer '+process.env.VC_STT_RUNNER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # Изолированный Chromium: Playwright Reader и этап автотестов. Наружу не
  # публикуется — ходит к нему только сервер по внутренней сети compose.
  browser-runner:
    build:
      context: .
      target: browser-runner-runtime
    image: voicechat-browser-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8792"
      VC_BROWSER_DATA_DIR: /data
      VC_BROWSER_RUNNER_TOKEN: ${VC_BROWSER_RUNNER_TOKEN:-voicechat-browser-local-token}
      # Корень внутреннего CA стенда (у нас — Caddy): без него изолированный
      # Chromium не откроет собственный сайт проекта по https.
      #
      # Передаётся значением, а не монтированием тома Caddy: весь его каталог
      # `pki` закрыт под root, потому что рядом с корнем лежит приватный ключ
      # центра — раннеру там делать нечего. Сам корневой сертификат публичен.
      # base64 — чтобы одна строка пережила .env, подстановку compose и шелл.
      VC_BROWSER_EXTRA_CA_B64: ${VC_BROWSER_EXTRA_CA_B64:-}
      # Адреса собственного стенда: контейнер не достаёт до публичного IP своего
      # же хоста (ufw режет «контейнер → INPUT», а опубликованные Docker порты
      # обходят ufw только для внешних подключений), зато ходит к соседнему
      # сервису по имени. Пары «внешний host:port=внутренний host:port».
      VC_BROWSER_HOST_ALIASES: ${VC_BROWSER_HOST_ALIASES:-}
      # Кому из внутренней сети доверяем как оркестратору: сервер, через прокси
      # которого идут браузерные проверки задач. Пара к VC_BROWSER_PREVIEW_BASE.
      VC_BROWSER_PREVIEW_ORIGIN: ${VC_BROWSER_PREVIEW_ORIGIN:-http://voicechat:8787}
    volumes:
      - vc-browser-data:/data
    # Chromium падает при нехватке разделяемой памяти: дефолтные 64 МБ ему мало.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8792/v1/health',{headers:{authorization:'Bearer '+process.env.VC_BROWSER_RUNNER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  automation-runner:
    build:
      context: .
      target: automation-runner-runtime
    image: voicechat-automation-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8800"
      VC_AUTOMATION_DATA_DIR: /data
      VC_AUTOMATION_RUNNER_TOKEN: ${VC_AUTOMATION_RUNNER_TOKEN:-voicechat-automation-local-token}
      VC_LLM_RUNNER_HEALTH_URL: http://runner-work:8790/v1/health
    volumes:
      - vc-automation-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8800/v1/health',{headers:{authorization:'Bearer '+process.env.VC_AUTOMATION_RUNNER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  runner-work:
    build:
      context: .
      target: llm-runner-runtime
      args:
        INSTALL_CLAUDE_CLI: "1"
        INSTALL_CODEX_CLI: "1"
    image: voicechat-llm-runner-work
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      VC_DATA_DIR: /data
      VC_RUNNER_TOKEN: ${VC_LLM_RUNNER_TOKEN:-voicechat-runner-local-token}
      VC_CODEX_SHARED_AUTH: "true"
      VC_CODEX_SHARED_AUTH_USER: admin
      VC_RUNNER_MIGRATE_CLI_USERS_FROM: /mnt/server-data
    volumes:
      - vc-runner-work-data:/data
      - vc-claude:/home/node/.claude
      - vc-codex:/home/node/.codex
      - vc-data:/mnt/server-data:ro
    logging: *default-logging
    restart: unless-stopped

  runner-personal:
    build:
      context: .
      target: llm-runner-runtime
      args:
        INSTALL_CLAUDE_CLI: "1"
        INSTALL_CODEX_CLI: "0"
    image: voicechat-llm-runner-personal
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      VC_DATA_DIR: /data
      VC_RUNNER_TOKEN: ${VC_LLM_RUNNER_TOKEN:-voicechat-runner-local-token}
      VC_CODEX_BIN: /bin/false
    volumes:
      - vc-runner-personal-data:/data
      - vc-runner-personal-claude:/home/node/.claude
      - vc-runner-personal-codex:/home/node/.codex
    logging: *default-logging
    restart: unless-stopped

  tts-runner:
    build:
      context: .
      target: tts-runner-runtime
    image: voicechat-tts-runner
    environment:
      HOST: 0.0.0.0
      PORT: "8791"
      VC_TTS_RUNNER_TOKEN: ${VC_TTS_RUNNER_TOKEN:-voicechat-tts-local-token}
      VC_TTS_DATA_DIR: /data
      VC_PIPER_VOICES_DIR: /data/voices
      VC_TTS_TEMP_DIR: /tmp/voicechat-tts
    volumes:
      - vc-tts-data:/data
      - vc-tts-temp:/tmp/voicechat-tts
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/v1/health',{headers:{authorization:'Bearer '+process.env.VC_TTS_RUNNER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # HTTPS для доступа по IP: без secure-контекста браузер не даёт микрофон.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - voicechat
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Публичный адрес стенда: подставляется в Caddyfile. Без него Caddy
      # поднимется с пустым хостом и не ответит ни на один запрос.
      VC_PUBLIC_HOST: ${VC_PUBLIC_HOST:?нужен VC_PUBLIC_HOST в .env — адрес, по которому стенд виден снаружи}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Локальный CA и выписанные сертификаты — переживают пересоздание.
      - vc-caddy:/data
    logging: *default-logging
    restart: unless-stopped

volumes:
  vc-data:
    name: voicechat-server-data
  vc-postgres:
  vc-automation-data:
  vc-browser-data:
  vc-claude:
  vc-codex:
  vc-stt-models:
  vc-stt-temp:
  vc-runner-work-data:
  vc-runner-personal-data:
  vc-runner-personal-claude:
  vc-runner-personal-codex:
  vc-tts-data:
  vc-tts-temp:
  vc-caddy:
